<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>THEgame</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud">
    <div id="cloudfog"></div>
    <div id="vignette"></div>
    <div id="aim"></div>
    <div id="nose"></div>
    <div id="fpv"></div>
    <div id="rpip" style="display:none"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="14"/><circle cx="20" cy="20" r="1.6" class="dot"/><path d="M20 2v6M20 32v6M2 20h6M32 20h6"/></svg></div>
    <div id="seeker" hidden></div>
    <div id="lockc" hidden></div>
    <div id="tgt" hidden></div>
        <svg id="gunsol" style="display:none"><rect width="22" height="22"/><line/><circle r="6.5"/></svg>
    <div id="xray"></div>
    <div id="notes"><div style="visibility:hidden">Airbrake on</div><div style="visibility:hidden">Landing gear extended</div></div>
    <div id="warns"></div>
    <div id="lost"></div>
    <div id="arms"></div>
    <div id="throttle"><i></i></div>
    <div id="gauges" hidden><b id="ias">0</b><small>KT</small><b id="gload">1.0</b><small>G</small></div>
  </div>
  <button id="devkit">DEV KIT</button>
  <div id="perf"></div>
  <div id="devmenu" hidden><button id="kit-viewer">CINEMATIC CAMERA</button><button id="kit-models">MODEL VIEWER</button><select id="kit-level"><option value="mission1">LEVEL: MISSION 1</option><option value="free">LEVEL: FREE FLIGHT</option></select><select id="kit-plane"><option value="f5">PLANE: F-5 (PLAYER)</option><option value="su25">PLANE: SU-25 (TEST)</option></select><button id="kit-clear">CLEAR ALL PLAYER DATA</button></div>
  <div id="touch" hidden></div>
  <div id="rotate"><svg viewBox="0 0 48 48" width="64" height="64" aria-hidden="true"><rect x="16" y="6" width="16" height="28" rx="3" fill="none" stroke="#fff" stroke-width="2.5"/><path d="M8 38 a16 16 0 0 0 30 0" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/><path d="M38 32 l0 6 l-6 0" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div id="start" class="show loading"><span>CLICK TO START</span><b></b></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
