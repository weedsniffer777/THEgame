<!doctype html><meta charset="utf-8"><title>retarget</title>
<script type="importmap">{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
<script type="module">
// Retargets Quaternius' Universal Animation Library pistol clips (CC0, Unreal-style skeleton) onto
// Drillimpact's PSX First Person Arms (CC0, Rigify-style names), seats the M1911 in the right hand,
// adds a camera anchor at the source character's eye, and exports one viewmodel GLB per weapon.
// Everything weapon-specific comes from tools/weapons.json (?weapon=<id>).
//
// Method: (1) pose-match the arms' rest pose to the source's bind pose bone by bone (direction
// swing; full basis for hands), (2) per frame, take each source bone's world-space rotation change
// from bind and apply it to the matched target rest, processing parents first.
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { GLTFExporter } from "three/addons/exporters/GLTFExporter.js";

const Q = new URLSearchParams(location.search);
const TUNE = JSON.parse(Q.get("tune") || "{}");
const CFG = await (await fetch("/tools/weapons.json")).json();
const WID = Q.get("weapon") || "m1911", W = CFG.weapons[WID], HOLD = CFG.holds[W.hold];
let FINGERS_ON = false;
const L = new GLTFLoader();
const [src, tgt, gunG] = await Promise.all([L.loadAsync("/tools/src/ual_standard.glb"), L.loadAsync("/models/fps_arms.glb"), L.loadAsync("/" + W.model)]);
const san = THREE.PropertyBinding.sanitizeNodeName;
const find = (root, n) => { let b = null; const a = san(n); root.traverse(o => { if (!b && (o.name === n || o.name === a)) b = o; }); return b; };
const wq = (o) => o.getWorldQuaternion(new THREE.Quaternion());
const wp = (o) => o.getWorldPosition(new THREE.Vector3());

// ---- bone map: [source, target, source child for direction, target child for direction]
const MAP = [];
for (const [s, S] of [["r", "R"], ["l", "L"]]) {
  MAP.push([`clavicle_${s}`, `shoulder.${S}`, `upperarm_${s}`, `upper_arm.${S}`]);
  MAP.push([`upperarm_${s}`, `upper_arm.${S}`, `lowerarm_${s}`, `forearm.${S}`]);
  MAP.push([`lowerarm_${s}`, `forearm.${S}`, `hand_${s}`, `hand.${S}`]);
  MAP.push([`hand_${s}`, `hand.${S}`, `middle_01_${s}`, `f_middle.01.${S}`, "hand"]);
  for (const [f, F] of [["index", "f_index"], ["middle", "f_middle"], ["ring", "f_ring"], ["pinky", "f_pinky"], ["thumb", "thumb"]]) {
    MAP.push([`${f}_01_${s}`, `${F}.01.${S}`, `${f}_02_${s}`, `${F}.02.${S}`]);
    MAP.push([`${f}_02_${s}`, `${F}.02.${S}`, `${f}_03_${s}`, `${F}.03.${S}`]);
    MAP.push([`${f}_03_${s}`, `${F}.03.${S}`, `${f}_04_leaf_${s}`, null]);
  }
}
const srcRoot = src.scene, tgtRoot = tgt.scene;
const srcSkinned = []; srcRoot.traverse(o => { if (o.isSkinnedMesh) srcSkinned.push(o); });
const pairs = MAP.map(([s, t, sc, tc, kind]) => ({ s: find(srcRoot, s), t: find(tgtRoot, t), sc: sc && find(srcRoot, sc), tc: tc && find(tgtRoot, tc), kind, names: [s, t] }))
  .filter(p => { if (!p.s || !p.t) console.warn("unmapped", p.names); return p.s && p.t; });
const depth = (o) => { let d = 0; while (o.parent) { d++; o = o.parent; } return d; };
pairs.sort((a, b) => depth(a.t) - depth(b.t));

// ---- facing: source in bind pose, target in its own finger_gun_idle (arms forward)
for (const m of srcSkinned) m.skeleton.pose();
srcRoot.updateMatrixWorld(true);
const tgtMixer = new THREE.AnimationMixer(tgtRoot);
tgtMixer.clipAction(THREE.AnimationClip.findByName(tgt.animations, "finger_gun_idle")).play(); tgtMixer.update(0.5); tgtRoot.updateMatrixWorld(true);
const tgtFwdZ = Math.sign(wp(find(tgtRoot, "hand.R")).z - wp(find(tgtRoot, "upper_arm.R")).z) || -1;
tgtMixer.stopAllAction(); tgtMixer.uncacheRoot(tgtRoot);
// reset target to bind
const tgtSkinned = []; tgtRoot.traverse(o => { if (o.isSkinnedMesh) tgtSkinned.push(o); });
for (const m of tgtSkinned) m.skeleton.pose();
tgtRoot.updateMatrixWorld(true);
// source facing from the aim pose
const srcMixer = new THREE.AnimationMixer(srcRoot);
const sclip = (n) => THREE.AnimationClip.findByName(src.animations, n);
let act = srcMixer.clipAction(sclip(HOLD.clips.hold)); act.play(); srcMixer.update(0.01); srcRoot.updateMatrixWorld(true);
const srcFwdZ = Math.sign(wp(find(srcRoot, "hand_r")).z - wp(find(srcRoot, "upperarm_r")).z) || 1;
act.stop(); for (const m of srcSkinned) m.skeleton.pose(); srcRoot.updateMatrixWorld(true);
const R = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), srcFwdZ === tgtFwdZ ? 0 : Math.PI), Ri = R.clone().invert();
const fwd = new THREE.Vector3(0, 0, tgtFwdZ);

// ---- (1) pose-match target rest to source bind
function setWorldQuat(o, q) { const pq = o.parent ? wq(o.parent) : new THREE.Quaternion(); o.quaternion.copy(pq.invert().multiply(q)); o.updateMatrixWorld(true); }
const basis = (d, side) => { const z = d.clone().normalize(), x = side.clone().addScaledVector(z, -side.dot(z)).normalize(), y = new THREE.Vector3().crossVectors(z, x); return new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(x, y, z)); };
for (const p of pairs) {
  if (p.kind === "hand") {
    const S = p.names[0].endsWith("_r") ? "R" : "L", s = S.toLowerCase();
    const sd = wp(find(srcRoot, `middle_01_${s}`)).sub(wp(p.s)).applyQuaternion(R), ss = wp(find(srcRoot, `index_01_${s}`)).sub(wp(find(srcRoot, `pinky_01_${s}`))).applyQuaternion(R);
    const td = wp(find(tgtRoot, `f_middle.01.${S}`)).sub(wp(p.t)), ts = wp(find(tgtRoot, `f_index.01.${S}`)).sub(wp(find(tgtRoot, `f_pinky.01.${S}`)));
    const q = basis(sd, ss).multiply(basis(td, ts).invert());
    setWorldQuat(p.t, q.multiply(wq(p.t)));
  } else if (p.sc && p.tc) {
    const sd = wp(p.sc).sub(wp(p.s)).normalize().applyQuaternion(R), td = wp(p.tc).sub(wp(p.t)).normalize();
    setWorldQuat(p.t, new THREE.Quaternion().setFromUnitVectors(td, sd).multiply(wq(p.t)));
  }
}
for (const p of pairs) { p.srcRest = wq(p.s); p.tgtRest = wq(p.t); }

// ---- camera anchor: source eye mapped into target space (aligned on shoulder midpoints)
const sMid = wp(find(srcRoot, "upperarm_r")).add(wp(find(srcRoot, "upperarm_l"))).multiplyScalar(0.5);
const tMid = wp(find(tgtRoot, "upper_arm.R")).add(wp(find(tgtRoot, "upper_arm.L"))).multiplyScalar(0.5);
const sW = wp(find(srcRoot, "upperarm_r")).distanceTo(wp(find(srcRoot, "upperarm_l"))), tW = wp(find(tgtRoot, "upper_arm.R")).distanceTo(wp(find(tgtRoot, "upper_arm.L")));
const scale = tW / sW;
const head = find(srcRoot, "Head"), eyeS = wp(head).add(new THREE.Vector3(0, 0.09, 0.1 * srcFwdZ).multiplyScalar(1 / scale));
const anchor = new THREE.Object3D(); anchor.name = "camera_anchor";
anchor.position.copy(tMid).add(eyeS.sub(sMid).applyQuaternion(R).multiplyScalar(scale)).add(new THREE.Vector3(...(TUNE.eye || W.eye || [0, 0, 0])));
anchor.quaternion.setFromAxisAngle(new THREE.Vector3(0, 1, 0), tgtFwdZ < 0 ? 0 : Math.PI); // camera looks down -Z
tgtRoot.add(anchor);

// ---- (2) bake clips
const FPS = 30;
// Per-action options from the hold type: blend toward the hold pose (keeps e.g. reloads on screen)
// and whether the support hand is pulled onto the grip.
const targetsNow = () => pairs.map(p => R.clone().multiply(wq(p.s).multiply(p.srcRest.clone().invert())).multiply(Ri).multiply(p.tgtRest));
let holdTargets = null;
function poseTargetFromSource(action = "hold") {
  const T = targetsNow(), k = HOLD.blendToHold?.[action] || 0;
  if (k && holdTargets) T.forEach((q, i) => q.slerp(holdTargets[i], k));
  pairs.forEach((p, i) => setWorldQuat(p.t, T[i]));
  if (HOLD.supportHandIK?.[action]) supportHandIK();
  if (FINGERS_ON) fingerContact();
}
// Arm lengths differ from the source, so the left (support) hand lands short of the grip.
// Two-bone IK pulls it onto the right hand: under the grip, on the left side, keeping its rotation.
const SUPPORT_IK = TUNE.ik ?? true;
function supportHandIK() {
  const up = find(tgtRoot, "upper_arm.L"), fo = find(tgtRoot, "forearm.L"), ha = find(tgtRoot, "hand.L"), hr = find(tgtRoot, "hand.R");
  const handRot = wq(ha);
  const camQ = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), tgtFwdZ < 0 ? 0 : Math.PI);
  const camRight = new THREE.Vector3(1, 0, 0).applyQuaternion(camQ), camUp = new THREE.Vector3(0, 1, 0), camFwdV = new THREE.Vector3(0, 0, -1).applyQuaternion(camQ);
  const o = TUNE.ikOff || HOLD.supportOffset || [-0.045, -0.05, -0.01]; // right/up/forward offset from the right wrist
  const T = wp(hr).addScaledVector(camRight, o[0]).addScaledVector(camUp, o[1]).addScaledVector(camFwdV, o[2]);
  const S = wp(up), E = wp(fo), W = wp(ha), a = E.distanceTo(S), b = W.distanceTo(E);
  const toT = T.clone().sub(S), d = THREE.MathUtils.clamp(toT.length(), 0.01, a + b - 1e-4), dir = toT.normalize();
  const bend = E.clone().sub(S); bend.addScaledVector(dir, -bend.dot(dir)); if (bend.lengthSq() < 1e-8) bend.copy(camUp).negate(); bend.normalize();
  const cosA = THREE.MathUtils.clamp((a * a + d * d - b * b) / (2 * a * d), -1, 1), sinA = Math.sqrt(1 - cosA * cosA);
  const E2 = S.clone().addScaledVector(dir, a * cosA).addScaledVector(bend, a * sinA);
  setWorldQuat(up, new THREE.Quaternion().setFromUnitVectors(E.clone().sub(S).normalize(), E2.clone().sub(S).normalize()).multiply(wq(up)));
  const E3 = wp(fo), W3 = wp(ha);
  setWorldQuat(fo, new THREE.Quaternion().setFromUnitVectors(W3.sub(E3).normalize(), T.clone().sub(E3).normalize()).multiply(wq(fo)));
  setWorldQuat(ha, handRot);
}
// ---- seat the M1911 in the right hand at the aim pose
srcMixer.stopAllAction(); const aimA = srcMixer.clipAction(sclip(HOLD.clips.hold)); aimA.play(); aimA.time = 0; srcMixer.update(0); srcRoot.updateMatrixWorld(true);
holdTargets = targetsNow(); poseTargetFromSource("hold");
const handR = find(tgtRoot, "hand.R");
const gun = gunG.scene; gun.name = "weapon"; gun.updateMatrixWorld(true);
// Measure the gun in its own space using the part roles from weapons.json.
const part = (k) => { let o = null; gun.traverse(c => { if (!o && c.name.endsWith("_" + k)) o = c; }); return o; };
const magB = new THREE.Box3().setFromObject(part(W.parts.grip)), slideB = new THREE.Box3().setFromObject(part(W.parts.slide));
const magC = magB.getCenter(new THREE.Vector3()), slideC = slideB.getCenter(new THREE.Vector3());
const gUp = new THREE.Vector3(0, Math.sign(slideC.y - magC.y) || 1, 0);                        // grip -> slide
const gFwd = new THREE.Vector3(0, 0, (slideB.max.z - magC.z) > (magC.z - slideB.min.z) ? 1 : -1); // muzzle side
const RAKE = TUNE.rake ?? W.gripRake ?? 0.3;                                                                  // 1911 grip angle
const gGrip = gUp.clone().multiplyScalar(Math.cos(RAKE)).addScaledVector(gFwd, -Math.sin(RAKE)).normalize();
// where the hand closes: top part of the grip, just under the slide
const gHold = magC.clone().lerp(new THREE.Vector3(magC.x, slideB.min.y * (gUp.y > 0 ? 1 : 0) + slideB.max.y * (gUp.y < 0 ? 1 : 0), magC.z), TUNE.holdT ?? W.gripHoldT ?? 0.35);
// Hand side: knuckle line (pinky -> index) is the grip axis; fist centre sits between palm and curled fingers.
const P = (n) => wp(find(tgtRoot, n));
const wGrip = P("f_index.01.R").sub(P("f_pinky.01.R")).normalize();
const fingersMid = P("f_index.02.R").add(P("f_middle.02.R")).add(P("f_ring.02.R")).add(P("f_pinky.02.R")).multiplyScalar(0.25);
const palmC = P("hand.R").lerp(P("f_middle.01.R"), 0.7);
const fist = palmC.lerp(fingersMid, TUNE.fistT ?? 0.5).add(new THREE.Vector3(...(TUNE.gunOff || [0, 0, 0])));
const camFwd = new THREE.Vector3(0, 0, -1).applyQuaternion(anchor.quaternion);
// Barrel points exactly along the view; the grip axis follows the knuckle line as closely as that allows.
const wFwd = camFwd.clone().normalize();
const wUp = wGrip.clone().addScaledVector(wFwd, -wGrip.dot(wFwd)).normalize();
const gUpP = gGrip.clone().addScaledVector(gFwd, -gGrip.dot(gFwd)).normalize();
const bas = (u, f) => new THREE.Matrix4().makeBasis(new THREE.Vector3().crossVectors(u, f), u, f);
const rot = new THREE.Quaternion().setFromRotationMatrix(bas(wUp, wFwd).multiply(bas(gUpP, gFwd).invert()));
gun.quaternion.copy(rot);
gHold.addScaledVector(gFwd, TUNE.holdZ ?? 0).addScaledVector(gUp, TUNE.holdY ?? 0); // + = hold point toward muzzle / slide
gun.position.copy(fist).sub(gHold.clone().applyQuaternion(rot));
window.__gunInfo = { magC: magC.toArray(), slideC: slideC.toArray(), gUp: gUp.y, gFwd: gFwd.z };
tgtRoot.add(gun); gun.updateMatrixWorld(true); handR.attach(gun);


// ---- finger contact: curl each right finger until its tip meets the grip (index: the trigger)
const gunSpace = (o) => { const c = o.clone(); c.position.set(0, 0, 0); c.quaternion.identity(); c.scale.set(1, 1, 1); c.updateMatrixWorld(true); return c; };
const g0 = gunSpace(gun), boxOf = (k) => { let n = null; g0.traverse(c => { if (!n && c.name.endsWith("_" + k)) n = c; }); return new THREE.Box3().setFromObject(n); };
const recB = boxOf(W.parts.frame), magB2 = boxOf(W.parts.grip), slideB2 = boxOf(W.parts.slide), trigB = boxOf(W.parts.trigger);
const gripBox = new THREE.Box3(new THREE.Vector3(recB.min.x, magB2.min.y, magB2.min.z), new THREE.Vector3(recB.max.x, slideB2.min.y, magB2.max.z)).expandByScalar(TUNE.gripPad ?? 0.004);
const trigC = trigB.getCenter(new THREE.Vector3());
const depthIn = (q) => gripBox.containsPoint(q) ? Math.min(q.x - gripBox.min.x, gripBox.max.x - q.x, q.y - gripBox.min.y, gripBox.max.y - q.y, q.z - gripBox.min.z, gripBox.max.z - q.z) : 0;
function fingerContact() {
  const axis0 = wp(find(tgtRoot, "f_index.01.R")).sub(wp(find(tgtRoot, "f_pinky.01.R"))).normalize();
  for (const F of ["f_middle", "f_ring", "f_pinky", "f_index"]) {
    const js = [1, 2, 3].map(i => find(tgtRoot, `${F}.0${i}.R`)), saved = js.map(j => j.quaternion.clone());
    const trial = (c) => {
      js.forEach((j, i) => j.quaternion.copy(saved[i])); js[0].updateMatrixWorld(true);
      const qa = new THREE.Quaternion().setFromAxisAngle(axis0, c * 0.45); setWorldQuat(js[0], qa.clone().multiply(wq(js[0])));
      const ax1 = axis0.clone().applyQuaternion(qa), qb = new THREE.Quaternion().setFromAxisAngle(ax1, c * 0.35); setWorldQuat(js[1], qb.clone().multiply(wq(js[1])));
      const ax2 = ax1.clone().applyQuaternion(qb); setWorldQuat(js[2], new THREE.Quaternion().setFromAxisAngle(ax2, c * 0.2).multiply(wq(js[2])));
      const p2 = wp(js[1]), p3 = wp(js[2]), tip = p3.clone().add(p3.clone().sub(p2).multiplyScalar(0.8));
      const L = (v) => gun.worldToLocal(v.clone());
      const pen = depthIn(L(p2)) + depthIn(L(p3)) + depthIn(L(tip));
      const d = F === "f_index" ? L(tip).distanceTo(trigC) : gripBox.distanceToPoint(L(tip));
      return d + pen * 12;
    };
    let best = 0, bestCost = Infinity;
    for (let c = -1.0; c <= 1.6001; c += 0.05) { const k = trial(c); if (k < bestCost) { bestCost = k; best = c; } }
    trial(best);
  }
}
FINGERS_ON = true;
const out = [];
for (const [action, sn] of Object.entries(HOLD.clips)) {
  const c = sclip(sn); if (!c) { console.warn("missing clip", sn); continue; }
  srcMixer.stopAllAction(); const a = srcMixer.clipAction(c); a.play();
  const n = Math.max(2, Math.round(c.duration * FPS) + 1), times = [], vals = pairs.map(() => []);
  for (let i = 0; i < n; i++) {
    const t = Math.min(c.duration, i / FPS); a.time = t; srcMixer.update(0); srcRoot.updateMatrixWorld(true);
    poseTargetFromSource(action); times.push(t);
    pairs.forEach((p, k) => { const q = p.t.quaternion; vals[k].push(q.x, q.y, q.z, q.w); });
  }
  out.push(new THREE.AnimationClip(action, c.duration, pairs.map((p, k) => new THREE.QuaternionKeyframeTrack(`${p.t.name}.quaternion`, times, vals[k]))));
}

// ---- gloves
const tex = await new THREE.TextureLoader().loadAsync("/models/fps_arms_gloves.jpg");
tex.flipY = false; tex.colorSpace = THREE.SRGBColorSpace; tex.userData.mimeType = "image/jpeg";
for (const m of tgtSkinned) { m.material = m.material.clone(); m.material.map = tex; m.material.metalness = 0; m.material.roughness = 0.85; }

// ---- preview renders from the camera anchor
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); renderer.setSize(960, 540);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x9aa6ae);
scene.add(new THREE.HemisphereLight(0xffffff, 0x777066, 1.6)); const dl = new THREE.DirectionalLight(0xffffff, 2); dl.position.set(-1, 3, 2); scene.add(dl);
scene.add(tgtRoot);
const cam = new THREE.PerspectiveCamera(60, 960 / 540, 0.01, 50);
const previews = {};
const dbg = new THREE.Mesh(new THREE.SphereGeometry(0.03), new THREE.MeshBasicMaterial({ color: 0xff0000 })); anchor.getWorldPosition(dbg.position);
const tm = new THREE.AnimationMixer(tgtRoot);
for (const [clipName, t] of [["hold", 0], ["reload", 0.45], ["shoot", 0.08]]) {
  tm.stopAllAction(); const a = tm.clipAction(out.find(c => c.name === clipName)); a.play(); a.time = t * a.getClip().duration; tm.update(0);
  tgtRoot.updateMatrixWorld(true); anchor.getWorldPosition(cam.position); anchor.getWorldQuaternion(cam.quaternion);
  renderer.render(scene, cam); previews[clipName] = renderer.domElement.toDataURL("image/jpeg", 0.85);
  if (Q.get("side")) {
    const eye = anchor.getWorldPosition(new THREE.Vector3());
    cam.position.copy(eye).add(new THREE.Vector3(1.6, 0.4, 0.6 * tgtFwdZ)); cam.lookAt(eye.clone().add(new THREE.Vector3(0, -0.2, 0.35 * tgtFwdZ)));
    scene.add(dbg); renderer.render(scene, cam); previews[clipName + "_side"] = renderer.domElement.toDataURL("image/jpeg", 0.85);
    const hp = wp(find(tgtRoot, "hand.R")); cam.position.copy(hp).add(new THREE.Vector3(0.35, 0.12, -0.25 * tgtFwdZ)); cam.lookAt(hp);
    renderer.render(scene, cam); previews[clipName + "_hand"] = renderer.domElement.toDataURL("image/jpeg", 0.85); continue; scene.remove(dbg); previews[clipName + "_side"] = renderer.domElement.toDataURL("image/jpeg", 0.85);
  }
}
tm.stopAllAction(); for (const m of tgtSkinned) m.skeleton.pose();
scene.remove(tgtRoot);

const glb = await new GLTFExporter().parseAsync(tgtRoot, { binary: true, animations: out });
const bytes = new Uint8Array(glb); let bin = ""; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
window.__retarget = { b64: btoa(bin), previews, info: { gun: window.__gunInfo, srcFwdZ, tgtFwdZ, scale, pairs: pairs.length, clips: out.map(c => c.name + ":" + c.duration.toFixed(2)) } };
</script>
