<!doctype html><meta charset="utf-8"><title>bake</title>
<script type="importmap">{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
<script type="module">
import * as THREE from "three";
import { mergeGeometries } from "three/addons/utils/BufferGeometryUtils.js";
import { GLTFExporter } from "three/addons/exporters/GLTFExporter.js";
import { buildShack, buildShackYard, buildYardL1, buildYardL2 } from "./shanty.js";

// Build, flatten into world space, merge meshes that share a material into one draw call.
// The shack and its yard are baked as two groups ("shack", "yard") so the game can treat them separately.
let tris = 0, calls = 0;
const isRoof = (o) => { for (let p = o; p; p = p.parent) if (p.userData.roof) return true; return false; };
const lvlOf = (o) => { for (let p = o; p; p = p.parent) if (p.userData.lvl) return p.userData.lvl; return 0; };
function mergeGroup(src, name, keep = () => true) {
  src.updateMatrixWorld(true);
  const byMat = new Map(), lines = [];
  src.traverse(o => {
    if (!keep(o)) return;
    if (o.isLineSegments) { lines.push(o); return; }
    if (!o.isMesh) return;
    let g = o.geometry.index ? o.geometry.toNonIndexed() : o.geometry.clone();
    g.applyMatrix4(o.matrixWorld);
    const n = g.attributes.position.count;
    if (!g.attributes.uv) g.setAttribute("uv", new THREE.BufferAttribute(new Float32Array(n * 2), 2));
    if (!g.attributes.color) g.setAttribute("color", new THREE.BufferAttribute(new Float32Array(n * 3).fill(1), 3));
    if (!g.attributes.normal) g.computeVertexNormals();
    for (const k of Object.keys(g.attributes)) if (!["position", "normal", "uv", "color"].includes(k)) g.deleteAttribute(k);
    const m = o.material; m.vertexColors = true;
    (byMat.get(m) || byMat.set(m, []).get(m)).push(g);
  });
  const grp = new THREE.Group(); grp.name = name;
  for (const [m, geos] of byMat) { const merged = mergeGeometries(geos, false); grp.add(new THREE.Mesh(merged, m)); tris += merged.attributes.position.count / 3; calls++; }
  for (const l of lines) { const g = l.geometry.clone().applyMatrix4(l.matrixWorld); const w = new THREE.LineSegments(g, l.material); w.name = "wire"; grp.add(w); calls++; }
  return grp;
}
const out = new THREE.Group(); out.name = "shanty_baked";
const shackSrc = buildShack();
// level-specific parts: shack_l1 only shows at base level 1 (boarded windows), shack_l2 / yard_l2 from level 2
out.add(mergeGroup(shackSrc, "shack", o => !isRoof(o) && !lvlOf(o)), mergeGroup(shackSrc, "shack_l1", o => !isRoof(o) && lvlOf(o) === 1),
  mergeGroup(shackSrc, "shack_l2", o => !isRoof(o) && lvlOf(o) === 2), mergeGroup(shackSrc, "shack_roof", isRoof),
  mergeGroup(buildShackYard(), "yard"), mergeGroup(buildYardL1(), "yard_l1"), mergeGroup(buildYardL2(), "yard_l2"));
const byMat = { size: calls };
const glb = await new GLTFExporter().parseAsync(out, { binary: true, maxTextureSize: 1024 });
const bytes = new Uint8Array(glb); let bin = ""; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
window.__bake = { b64: btoa(bin), tris, calls, materials: byMat.size };
</script>
